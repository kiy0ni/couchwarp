name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web, room server and protocol (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  protocol:
    name: Protocol (Rust, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p couchwarp-protocol

  host:
    name: Host (Rust, ${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - if: runner.os != 'Linux'
        run: cargo test
      # The command-line host, to try a change on a real Windows PC before a release.
      - if: runner.os == 'Windows'
        run: cargo build --release -p couchwarp-host
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: couchwarp-host-windows
          path: target/release/couchwarp-host.exe
          retention-days: 7
      # On Linux the capture test opens a window on a virtual X display.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a cargo test

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libudev-dev
      - run: cargo clippy -p couchwarp-desktop --all-targets -- -D warnings
