[package]
name = "couchwarp-desktop"
version = "0.2.6"
description = "Couchwarp for Mac and Windows: host a game for friends, or join theirs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The Dock and the task manager show the executable's name.
[[bin]]
name = "Couchwarp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Reading the motion sensors of PlayStation and Switch controllers, which the app's web
# view cannot (no WebHID). Shared on macOS so the page's Gamepad API keeps the controller;
# hidraw on Linux (needs libudev-dev to build); Windows' own HID API there.
hidapi = { version = "2.6", default-features = false, features = [
  "macos-shared-device",
  "linux-static-hidraw",
  "windows-native",
] }
anyhow = "1"
base64 = "0.22"
couchwarp-host = { path = "../../../crates/host" }
serde = { version = "1", features = ["derive"] }
# Used by `generate_context!` to embed the plugins' settings from tauri.conf.json.
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS's own controller driver turns a controller's motion sensors off unless an app asks
# for them, even while the app reads its raw reports (motion.rs).
objc2-game-controller = { version = "0.3", default-features = false, features = [
  "std",
  "GCController",
  "GCMotion",
] }

[target.'cfg(windows)'.dependencies]
# Downloading VIIPER and checking it is the expected file.
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Keeping the computer awake during a game.
windows = { version = "0.62", features = ["Win32_System_Power"] }
