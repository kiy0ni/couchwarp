[package]
name = "couchwarp-desktop"
version = "0.2.0"
description = "Couchwarp for Mac and Windows: host a game for friends, or join theirs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The Dock and the task manager show the executable's name.
[[bin]]
name = "Couchwarp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
couchwarp-host = { path = "../../../crates/host" }
serde = { version = "1", features = ["derive"] }
# Used by `generate_context!` to embed the plugins' settings from tauri.conf.json.
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Downloading VIIPER and checking it is the expected file.
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Keeping the computer awake during a game.
windows = { version = "0.62", features = ["Win32_System_Power"] }
