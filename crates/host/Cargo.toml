[package]
name = "couchwarp-host"
version = "0.1.0"
description = "Streams one game window to Couchwarp guests and plays their controllers and keyboards into it"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "couchwarp-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
couchwarp-protocol = { path = "../protocol" }
fastrand = "2"
# Every address of this machine, so guests on a VPN or over IPv6 can reach it too.
if-addrs = "0.15"
opus = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.15", default-features = false }
serde_json = "1"
# Default features would pull an example web server; each platform picks its crypto below.
str0m = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Sign-in checks and sign-out: a few small HTTPS requests.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Small pictures of the game for the public room list.
jpeg-encoder = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
# Single-frame capture for window previews needs macOS 14.
screencapturekit = { version = "11", features = ["macos_14_0"] }
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Virtual keyboard, mouse and controllers (uinput).
evdev = "0.13"
openh264 = "0.9"
openh264-sys2 = "0.9"
str0m = { version = "0.25", default-features = false, features = ["aws-lc-rs"] }
# X11 in pure Rust: no C library to link.
# The pointer (XFixes) and shared memory for the pictures (MIT-SHM).
x11rb = { version = "0.14", features = ["shm", "xfixes"] }

[dev-dependencies]
# The Windows and Linux encoder is tested on every platform.
openh264 = "0.9"
openh264-sys2 = "0.9"

[target.'cfg(windows)'.dependencies]
openh264 = "0.9"
# The raw option to change the bitrate of a running encoder.
openh264-sys2 = "0.9"
# Windows' own cryptography (CNG): no C library to build.
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
viiper-client = "0.9"
wasapi = "0.27"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2"
