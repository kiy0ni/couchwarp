[package]
name = "couchwarp-host"
version = "0.1.0"
description = "Streams one game window to Couchwarp guests and plays their controllers and keyboards into it"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "couchwarp-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
couchwarp-protocol = { path = "../protocol" }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.15", default-features = false }
serde_json = "1"
str0m = "0.25"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
screencapturekit = "11"
